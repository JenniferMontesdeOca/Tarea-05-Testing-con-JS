<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Predicciones del Día</title>
    <link href="./resources/css/styles.css" type="text/css" rel="stylesheet">

</head>
<body>
    <div class="container">
        <h1>Generador de Predicciones del Día</h1>
        <label for="userName">Ingresa tu nombre:</label>
        <input type="text" id="userName" placeholder="Tu nombre">
        <br>
        <label for="weatherCondition">Ingresa el clima actual:</label>
        <input type="text" id="weatherCondition" placeholder="Ejemplo: Soleado">
        <br>
        <button onclick="generatePrediction()">Obtener Predicción</button>
        <p id="output"></p>
    </div>


<script src="./resources/js/script.js"></script>
</html>
